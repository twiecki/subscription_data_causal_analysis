# Loop 3: workspace integrity — the repo is the agents' memory, and memory
# rots. Runs the reference/binding/staleness/copy-drift/superseded suite and
# the data-layer invariant gate on every PR and push. No API keys needed.
name: integrity

on:
  pull_request:
  push:
    branches: [main, production-repo]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python 1-data/build_data.py
      - run: uv run pytest -q
      - run: uv run python 3-insights/checks/integrity.py
      - name: alias table is append-only
        run: |
          git fetch origin main --depth 1
          if git cat-file -e origin/main:3-insights/alias.tsv 2>/dev/null; then
            git show origin/main:3-insights/alias.tsv > /tmp/alias_main.tsv
            head -n "$(wc -l < /tmp/alias_main.tsv)" 3-insights/alias.tsv | diff /tmp/alias_main.tsv - \
              || { echo "alias.tsv rewrote or removed existing lines — it is append-only"; exit 1; }
          fi
